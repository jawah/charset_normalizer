name: Continuous Delivery

on:
  release:
    types:
      - created
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  pre_flight_check:
    name: Preflight Checks
    uses: ./.github/workflows/ci.yml

  universal-wheel:
    name: Build Universal Wheel
    runs-on: ubuntu-24.04
    needs: pre_flight_check
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3'
      - name: Install CI Requirements
        run: |
          python -m pip install -r ci-requirements.txt --require-hashes
      - name: Build Wheel
        env:
          CHARSET_NORMALIZER_USE_CYTHON: '0'
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-universal
          path: dist

  native-abi3:
    name: Build abi3 wheels on ${{ matrix.target.os }}
    needs: pre_flight_check
    runs-on: ${{ matrix.target.os }}
    strategy:
      matrix:
        target: &native_targets
          - os: ubuntu-24.04
            qemu: ''
          - os: windows-latest
            qemu: ''
          - os: macos-15
            qemu: ''
            mac_arch: arm64
          - os: macos-15-intel
            qemu: ''
            mac_arch: x86_64
          - os: windows-11-arm
            qemu: ''
          - os: ubuntu-24.04-arm
            qemu: ''
        variant:
          - &abi3_variant
            name: abi3
            build: 'cp39-* cp311-win_arm64'
            abi3: '1'
    steps: &wheel_steps
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - name: Set up QEMU
        if: ${{ matrix.target.qemu }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all
        id: qemu
      - name: Prepare emulation
        if: ${{ matrix.target.qemu }}
        run: |
          echo "CIBW_ARCHS_LINUX=${{ matrix.target.qemu }}" >> $GITHUB_ENV
        shell: bash
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      - name: Build wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_BUILD_FRONTEND: build
          CIBW_BUILD: ${{ matrix.variant.build }}
          CIBW_ARCHS_MACOS: ${{ matrix.target.mac_arch || 'auto' }}
          CIBW_ENVIRONMENT: >-
            CHARSET_NORMALIZER_USE_CYTHON='1'
            CHARSET_NORMALIZER_CYTHON_ABI3='${{ matrix.variant.abi3 }}'
            CHARSET_NORMALIZER_USE_PGO='${{ matrix.target.qemu == '' && (vars.CHARSET_NORMALIZER_USE_PGO || '1') != '0' && '1' || '0' }}'
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest -c "{package}/pyproject.toml" "{package}/tests"
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.target.mac_arch && format('slices-{0}-{1}', matrix.variant.name, matrix.target.mac_arch) || format('dist-{0}-{1}-{2}', matrix.target.os, matrix.target.qemu, matrix.variant.name) }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  macos-abi3-merge:
    name: Merge macOS abi3 slices
    needs: native-abi3
    runs-on: macos-15
    env:
      WHEEL_VARIANT: abi3
    steps: &universal2_merge_steps
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: slices-${{ env.WHEEL_VARIANT }}-x86_64
          path: slices/x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: slices-${{ env.WHEEL_VARIANT }}-arm64
          path: slices/arm64
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install delocate==0.13.0
      - run: python bin/merge_macos_wheels.py slices/x86_64 slices/arm64 wheelhouse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-macos-universal2-${{ env.WHEEL_VARIANT }}
          path: wheelhouse/*_universal2.whl
          if-no-files-found: error

  macos-abi3-smoke:
    name: Import merged abi3 wheel on ${{ matrix.os }}
    needs: macos-abi3-merge
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist-macos-universal2-abi3
          path: wheelhouse
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --no-index --no-deps --force-reinstall --find-links=wheelhouse charset-normalizer
      - name: Load the compiled detectors and run detection
        run: |
          python -I - <<'PY'
          from importlib.machinery import ExtensionFileLoader
          from charset_normalizer import cd, md, from_bytes

          assert all(isinstance(m.__loader__, ExtensionFileLoader) for m in (cd, md))
          assert from_bytes(b"plain ASCII text").best().encoding == "ascii"
          PY

  build-wheels:
    name: Build native wheels on ${{ matrix.target.os }}
    needs: pre_flight_check
    runs-on: ${{ matrix.target.os }}
    strategy:
      matrix:
        target: *native_targets
        variant:
          - &native_variant
            name: native
            build: 'cp3*-*'
            abi3: '0'
    steps: *wheel_steps

  emulated-wheels:
    name: Build ${{ matrix.variant.name }} wheels on ${{ matrix.target.qemu }}
    needs: pre_flight_check
    runs-on: ${{ matrix.target.os }}
    strategy:
      matrix:
        target:
          - os: ubuntu-24.04
            qemu: ppc64le
            mac_arch: ''
          - os: ubuntu-24.04
            qemu: riscv64
            mac_arch: ''
          - os: ubuntu-24.04
            qemu: s390x
            mac_arch: ''
          - os: ubuntu-24.04
            qemu: armv7l
            mac_arch: ''
        variant: [*native_variant, *abi3_variant]
    steps: *wheel_steps

  macos-native-merge:
    name: Merge macOS native slices
    needs: build-wheels
    runs-on: macos-15
    env:
      WHEEL_VARIANT: native
    steps: *universal2_merge_steps

  build-cross-wheels:
    name: Build ${{ matrix.name }} wheels
    runs-on: ${{ matrix.runner }}
    needs: pre_flight_check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pyodide
            runner: ubuntu-24.04
            platform: pyodide
            build: >-
              cp313-pyodide_wasm32
              cp314-pyodide_wasm32
            archs: wasm32
            enable: pyodide-eol
          - name: android
            runner: ubuntu-24.04
            platform: android
            build: >-
              cp313-android_*
              cp314-android_*
            archs: >-
              x86_64
              arm64_v8a
          - name: ios
            runner: macos-15
            platform: ios
            build: >-
              cp313-ios_*
              cp314-ios_*
            archs: >-
              arm64_iphoneos
              arm64_iphonesimulator
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          persist-credentials: false
      - name: Build wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_PLATFORM: ${{ matrix.platform }}
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_ENABLE: ${{ matrix.enable }}
          CIBW_BUILD_FRONTEND: build
          CIBW_ENVIRONMENT: >-
            CHARSET_NORMALIZER_USE_CYTHON='1'
            CHARSET_NORMALIZER_CYTHON_ABI3='0'
            CHARSET_NORMALIZER_USE_PGO='0'
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SKIP: ${{ matrix.platform == 'pyodide' && '*-pyodide_*' || '' }}
          CIBW_TEST_SOURCES: >-
            tests
            pyproject.toml
          CIBW_TEST_COMMAND: >-
            python -m pytest
            -c pyproject.toml
            tests/test_mess_detection.py
            tests/test_coherence_detection.py
            tests/test_base_detection.py
          ANDROID_API_LEVEL: '24'
          IPHONEOS_DEPLOYMENT_TARGET: '13.0'
          CIBW_XBUILD_TOOLS_IOS: ''
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-${{ matrix.name }}
          path: ./wheelhouse/*.whl

  checksum:
    name: Compute hashes
    runs-on: ubuntu-latest
    needs:
      - emulated-wheels
      - macos-abi3-smoke
      - macos-native-merge
      - build-cross-wheels
      - universal-wheel
    outputs:
      hashes: ${{ steps.compute.outputs.hashes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dist*
          merge-multiple: true
          path: dist
      - name: Collected dists
        run: |
          tree dist
      - name: Generate hashes
        id: compute  #  needs.checksum.outputs.hashes
        working-directory: ./dist
        run: echo "hashes=$(sha256sum * | base64 -w0)" >> $GITHUB_OUTPUT

  provenance:
    needs: checksum
    if: startsWith(github.ref, 'refs/tags/')
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    permissions:
      actions: read
      id-token: write
      contents: write
    with:
      base64-subjects: ${{ needs.checksum.outputs.hashes }}
      upload-assets: true
      compile-generator: true

  deploy:
    name: 🚀 Deploy to PyPi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      contents: write
    needs: provenance
    environment:
      name: pypi
      url: https://pypi.org/project/charset-normalizer/
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dist*
          merge-multiple: true
          path: dist
      - name: Collected dists
        run: |
          tree dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      - name: Install Syft
        run: |
          curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b /usr/local/bin
          syft version
      - name: Generate SBOMs
        run: |
          set -euo pipefail
          shopt -s nullglob

          restore_from=""
          restore_to=""

          for pkg in dist/*.whl dist/*.tar.gz; do
            original_pkg="$pkg"
            original_base="$(basename -- "$original_pkg")"
            out="dist/${original_base}.cdx.json"

            if [[ "$original_pkg" == *.whl ]]; then
              zip_pkg="${original_pkg%.whl}.zip"
              zip_base="${original_base%.whl}.zip"
              stem="${original_base%.whl}"

              echo "Temporarily renaming ${original_base} -> ${zip_base}"
              mv -- "$original_pkg" "$zip_pkg"
              restore_from="$zip_pkg"
              restore_to="$original_pkg"

              echo "Generating SBOM for $original_base via $zip_base"
              syft "file:$zip_pkg" -o cyclonedx-json > "$out"

              tmp="$out.tmp"
              jq --arg stem "$stem" '
                (. | .. | objects | select(has("name")) | .name)
                |= (if . == ($stem + ".zip") then $stem + ".whl" else . end)
              ' "$out" > "$tmp" && mv "$tmp" "$out"

              echo "Restoring ${zip_base} -> ${original_base}"
              mv -- "$zip_pkg" "$original_pkg"
              restore_from=""
              restore_to=""
            else
              echo "Generating SBOM for $original_base"
              syft "file:$original_pkg" -o cyclonedx-json > "$out"
            fi
          done
      - name: Upload dists to GitHub Release
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          REF_NAME: "${{ github.ref_name }}"
          REPOSITORY: "${{ github.repository }}"
        run: |
          set -euo pipefail

          files=(dist/*)
          batch_size=50
          max_retries=3

          for (( i=0; i<${#files[@]}; i+=batch_size )); do
            batch=("${files[@]:i:batch_size}")
            echo "Uploading batch $((i/batch_size + 1)) (${#batch[@]} files)..."

            for (( attempt=1; attempt<=max_retries; attempt++ )); do
              if gh release upload "$REF_NAME" "${batch[@]}" --repo "$REPOSITORY" --clobber; then
                break
              fi

              if (( attempt == max_retries )); then
                echo "Failed to upload batch after $max_retries attempts"
                exit 1
              fi

              delay=$(( attempt * 15 ))
              echo "Upload failed (attempt $attempt/$max_retries). Retrying in ${delay}s..."
              sleep "$delay"
            done
          done
